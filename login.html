<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MorfeoTrip - Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- La presentación usa Bootstrap; no se necesita una hoja CSS propia. -->
</head>
<body class="bg-primary">
  <!-- Fondo de viaje y superposición oscura hechos con utilidades Bootstrap. -->
  <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=1920&amp;q=80"
       class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover pe-none" alt="" aria-hidden="true">
  <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 pe-none" aria-hidden="true"></div>

  <div class="container position-relative z-1 min-vh-100 d-flex align-items-center py-4">
    <div class="row justify-content-center w-100 mx-0">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

        <!-- Logo + título -->
        <a href="login.html" class="d-flex align-items-center justify-content-center gap-2 text-white text-decoration-none mb-3">
          <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="22" fill="none" stroke="#fff" stroke-width="3"/>
            <path d="M24 8 L30 24 L24 40 L18 24 Z" fill="#F2B134"/>
            <path d="M24 8 L30 24 L24 24 Z" fill="#fff"/>
            <circle cx="24" cy="24" r="2.5" fill="#0B3C5D"/>
          </svg>
          <span class="h1 fw-bold mb-0">MorfeoTrip</span>
        </a>

        <div class="card border-0 rounded-4 shadow-lg">
          <div class="card-body p-4">

            <h2 class="h4 mb-1">Iniciar sesión</h2>
            <p class="text-secondary mb-4">Entra para retomar tus viajes.</p>

            <form id="formLogin" novalidate>
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="tu@correo.com">
                <div class="invalid-feedback" id="error-loginEmail"></div>
              </div>

              <div class="mb-3">
                <label for="loginPass" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="loginPass">
                <div class="invalid-feedback" id="error-loginPass"></div>
              </div>

              <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
              <p class="text-success text-center mt-3 mb-0" id="okLogin"></p>
            </form>

            <hr class="my-4">
            <p class="text-center mb-0">
              ¿No tienes cuenta? <a href="register.html" class="link-primary fw-semibold text-decoration-none">Crear cuenta</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
