<!DOCTYPE html>
<!-- Vista Jakarta Faces para crear nuevas cuentas. -->
<!-- h corresponde a componentes estándar de Jakarta Faces. -->
<!-- p corresponde a componentes AJAX de PrimeFaces. -->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:pt="jakarta.faces.passthrough">
<!-- Cabecera gestionada por JSF: título, Bootstrap y estilos propios. -->
<h:head>
    <title>MorfeoTrip - Crear cuenta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        /* Mantiene visible el check blanco sobre el fondo azul. */
        #regTerminos:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3cpath fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='m5 10 3 3 7-7'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 70%;
        }
    </style>
</h:head>
<!-- Cuerpo de la vista. -->
<h:body styleClass="bg-primary position-relative">

    <!-- Fondo visual de la pantalla de registro. -->
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=1920&amp;q=80"
         class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover pe-none" alt="" aria-hidden="true"/>
    <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 pe-none" aria-hidden="true"/>
    <div class="container position-relative min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card border-0 rounded-4 shadow-lg w-100" style="max-width: 440px">
            <div class="card-body p-4">

                <h:link outcome="/dashboard" class="d-flex align-items-center justify-content-center gap-2 text-dark text-decoration-none mb-3">
                    <h:graphicImage name="images/logo.svg"
                                    width="44" height="44" styleClass="rounded-4 shadow"
                                    alt="Logo de MorfeoTrip"/>
                    <span class="h1 fw-bold mb-0">MorfeoTrip</span>
                </h:link>
                <p class="text-secondary text-center mb-4">Crea tu cuenta en menos de un minuto.</p>
                <!-- Formulario JSF que envía los datos a RegisterBean. -->
                <h:form id="formRegistro" prependId="false">
                    <!-- Evita repetir el mismo resumen como detalle. -->
                    <p:messages id="messages" showDetail="false" closable="true"/>
                    <div class="mb-3">
                        <!-- Este valor será el usuario para iniciar sesión. -->
                        <h:outputLabel for="regNombre" value="Nombre de usuario" styleClass="form-label"/>
                        <p:inputText id="regNombre" value="#{registerBean.username}" required="true"
                                     styleClass="form-control" placeholder="ana123"
                                     requiredMessage="Escribe tu nombre de usuario."/>
                        <div class="invalid-feedback" id="error-regNombre"></div>
                    </div>
                    <div class="mb-3">
                        <!-- Campo enlazado con registerBean.email. -->
                        <h:outputLabel for="regEmail" value="Correo electrónico" styleClass="form-label"/>
                        <p:inputText id="regEmail" value="#{registerBean.email}" required="true"
                                     styleClass="form-control" placeholder="tu@correo.com"
                                     requiredMessage="Escribe tu correo."/>
                        <div class="invalid-feedback" id="error-regEmail"></div>
                    </div>
                    <div class="mb-3">
                        <!-- Campo de contraseña enlazado con registerBean.password. -->
                        <h:outputLabel for="regPass" value="Contraseña" styleClass="form-label"/>
                        <p:password id="regPass" value="#{registerBean.password}" required="true"
                                    styleClass="form-control" placeholder="Mínimo 8 caracteres"
                                    requiredMessage="Escribe una contraseña."/>
                        <div class="form-text">Mínimo 8 caracteres, una mayúscula y un número.</div>
                        <div class="invalid-feedback" id="error-regPass"></div>
                    </div>
                    <div class="mb-3">
                        <!-- Compara esta contraseña con la anterior en registerBean. -->
                        <h:outputLabel for="regPass2" value="Repite la contraseña" styleClass="form-label"/>
                        <p:password id="regPass2" value="#{registerBean.passwordConfirmation}"
                                    required="true" styleClass="form-control"
                                    requiredMessage="Repite la contraseña."/>
                        <div class="invalid-feedback" id="error-regPass2"></div>
                    </div>
                    <div class="form-check mb-3">
                        <!-- Checkbox HTML validado localmente por register.js. -->
                        <input class="form-check-input" type="checkbox" id="regTerminos"/>
                        <label class="form-check-label small" for="regTerminos">Acepto los términos y condiciones</label>
                        <div class="invalid-feedback" id="error-regTerminos"></div>
                    </div>
                    <!-- Ejecuta el registro y actualiza el formulario con el resultado. -->
                    <p:commandButton value="Crear cuenta" action="#{registerBean.register}"
                                     update="@form" styleClass="btn bg-success text-white border-0 w-100"/>
                </h:form>
                <p class="text-center text-secondary mt-4 mb-0">
                    ¿Ya tienes cuenta?
                    <a href="login.xhtml" class="link-primary fw-semibold">Iniciar sesión</a>
                </p>
            </div>
        </div>
    </div>
</h:body>
</html>
