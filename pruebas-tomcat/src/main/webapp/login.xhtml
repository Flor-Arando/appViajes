<!DOCTYPE html>
<!-- Vista Jakarta Faces: combina etiquetas JSF/PrimeFaces con HTML y Bootstrap. -->
<!-- h genera componentes HTML administrados por Jakarta Faces. -->
<!-- p aporta componentes visuales y AJAX de PrimeFaces. -->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces"
      xmlns:pt="jakarta.faces.passthrough">
<!-- h:head permite que JSF gestione recursos de la página. -->
<h:head>
    <title>MorfeoTrip - Iniciar sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body styleClass="bg-primary position-relative">


    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=1920&amp;q=80"
         class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover pe-none" alt="" aria-hidden="true"/>
    <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 pe-none" aria-hidden="true"/>
    <div class="container position-relative min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card border-0 rounded-4 shadow-lg w-100" style="max-width: 440px">
            <div class="card-body p-4">

                <a href="login.xhtml" class="d-flex align-items-center justify-content-center gap-2 text-dark text-decoration-none mb-3">
                    <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true">
                        <circle cx="24" cy="24" r="22" fill="none" stroke="#0B3C5D" stroke-width="3"/>
                        <path d="M24 8 L30 24 L24 40 L18 24 Z" fill="#F2B134"/>
                        <path d="M24 8 L30 24 L24 24 Z" fill="#0B3C5D"/>
                        <circle cx="24" cy="24" r="2.5" fill="#0B3C5D"/>
                    </svg>
                    <span class="h1 fw-bold mb-0">MorfeoTrip</span>
                </a>
                <p class="text-secondary text-center mb-4">Entra para retomar tus viajes.</p>
                <!-- h:form crea el formulario JSF; prependId evita prefijos en los IDs. -->
                <h:form id="formLogin" prependId="false">
                    <!-- Muestra una sola vez el resumen de cada respuesta. -->
                    <p:messages id="messages" showDetail="false" closable="true"/>
                    <div class="mb-3">
                        <!-- h:outputLabel genera la etiqueta asociada al campo. -->
                        <h:outputLabel for="loginEmail" value="Usuario" styleClass="form-label"/>
                        <!-- p:inputText enlaza el texto con loginBean.username. -->
                        <p:inputText id="loginEmail" value="#{loginBean.username}" required="true"
                                     styleClass="form-control" placeholder="admin"
                                     requiredMessage="Escribe tu usuario."/>
                        <div class="invalid-feedback" id="error-loginEmail"></div>
                    </div>
                    <div class="mb-3">
                        <h:outputLabel for="loginPass" value="Contraseña" styleClass="form-label"/>
                        <!-- p:password oculta la contraseña y la enlaza con el bean. -->
                        <p:password id="loginPass" value="#{loginBean.password}" required="true"
                                    styleClass="form-control" placeholder="1234"
                                    requiredMessage="Escribe tu contraseña."/>
                        <div class="invalid-feedback" id="error-loginPass"></div>
                    </div>
                    <!-- Ejecuta loginBean.login y actualiza el formulario sin recargarlo. -->
                    <p:commandButton value="Iniciar sesión" action="#{loginBean.login}"
                                     ajax="false" styleClass="btn btn-primary w-100"/>
                </h:form>

                <p class="text-center text-secondary mt-4 mb-0">
                    ¿No tienes cuenta?
                    <a href="register.xhtml" class="link-primary fw-semibold">Crear cuenta</a>
                </p>
                <p class="small text-center text-secondary mt-3 mb-0">Prueba: admin / 1234</p>
            </div>
        </div>
    </div>
    <!-- Carga login.js como recurso gestionado por Jakarta Faces. -->
    <h:outputScript library="js" name="login.js" target="body"/>
</h:body>
</html>
