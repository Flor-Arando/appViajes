<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MorfeoTrip - Historial de Vuelos</title>
    
    <!-- cargo bootstrap aki q si no se ve feisimo todo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- pillo los iconos de esta web pa no meter svgs kilometricos q no hay kien los entienda -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    





    <link rel="shortcut icon" href="brujula.png" type="image/x-icon">
    




    <style>
        /* le meto lo justo de css pa que no parezca cutre */
        body {
            background-color: #ffffff; 
        }
        
        /* animacion< guapa que parece que flota la carta */
        .tarjeta-vuelo {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .tarjeta-vuelo:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15) !important;
        }

        /* pa que las fotos no se aplasten y queden todas cuadradas del mismo tamaño */
        .img-vuelo {
            height: 250px;
            object-fit: cover;


        }

        /*  efecto cristal transparente  */
        .navbar-cristal {
            background-color: rgba(255, 255, 255, 0.75) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

    

    </style>
</head>
<body>

    <!-- el menu de arriba ahora con efecto cristal transparente  -->
    <nav class="navbar navbar-expand-lg navbar-cristal sticky-top py-2.5  shadow-sm">
        <div class="container justify-content-center">
            <span class="navbar-brand mb-0 h1 fw-bold text-dark">MorfeoTrip</span>
        </div>
    </nav>





    <main class="container mt-5 mb-5">
        
        <!-- titulo de la movida -->
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold text-dark">Historial de vuelos</h1>
            <p class="text-secondary fs-5">Tus lugares en el mundo. Todos aquí.</p>
        </header>

        <!-- el buscador este me costo un huevo pillarlo con el input group pero ya va -->
        <section class="row justify-content-center mb-5">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="input-group input-group-lg shadow-sm rounded-4 overflow-hidden">
                    <span class="input-group-text bg-white border-0 text-secondary">
                        <i class="bi bi-search"></i>
                    </span>
                    <input type="text" id="searchInput" class="form-control border-0" placeholder="Busca un país o ciudad..." autocomplete="off">
                </div>
            </div>
        </section>



        <!-- botonicos con forma d pildora pa filtrar -->
        <section class="d-flex justify-content-center flex-wrap gap-2 mb-5">
            <button class="btn btn-dark rounded-pill px-4 filter-btn" data-filter="todos">Todos</button>
            <button class="btn btn-outline-secondary rounded-pill px-4 filter-btn" data-filter="asia">Asia</button>
            <button class="btn btn-outline-secondary rounded-pill px-4 filter-btn" data-filter="europa">Europa</button>
            <button class="btn btn-outline-secondary rounded-pill px-4 filter-btn" data-filter="norteamerica">Norteamérica</button>
            <button class="btn btn-outline-secondary rounded-pill px-4 filter-btn" data-filter="sudamerica">Sudamérica</button>
            <button class="btn btn-outline-secondary rounded-pill px-4 filter-btn" data-filter="oceania">Oceanía</button>
            <button class="btn btn-outline-secondary rounded-pill px-4 filter-btn" data-filter="africa">África</button>
        </section>

        <section class="row justify-content-center align-items-end g-3 mb-4" aria-label="Filtros avanzados">
            <div class="col-12 col-sm-6 col-lg-2">
                <label for="fechaDesde" class="form-label small text-secondary mb-1">Desde</label>
                <input type="date" id="fechaDesde" class="form-control">
            </div>
            <div class="col-12 col-sm-6 col-lg-2">
                <label for="fechaHasta" class="form-label small text-secondary mb-1">Hasta</label>
                <input type="date" id="fechaHasta" class="form-control">
            </div>
            <div class="col-12 col-sm-6 col-lg-3">

                <label for="filtroEstado" class="form-label small text-secondary mb-1">Estado del vuelo</label>
                <select id="filtroEstado" class="form-select">
                    <option value="todos">Todos los estados</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmado">Confirmado</option>
                    <option value="completado">Completado</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-lg-2">
                <button type="button" class="btn btn-outline-secondary w-100" id="limpiarFiltros">Limpiar filtros</button>
            </div>
        </section>

        <p id="resultCount" class="text-center text-secondary mb-3" aria-live="polite"></p>

        
        <!-- Las tarjetas se cargan desde el historial local. -->
        <section class="row g-4" id="gallery" aria-live="polite"></section>


        <div id="emptyHistory" class="text-center mt-5" style="display: none;">
            <i class="bi bi-airplane fs-1 text-secondary mb-3"></i>
            <h4 class="text-dark">Tu historial está vacío</h4>
            <p class="text-secondary">Los vuelos de ejemplo y los cambios que hagas se guardan en este navegador.</p>
            <a href="pago.html" class="btn btn-outline-primary rounded-pill">Probar el pago de demostración</a>
        </div>

        <div id="storageError" class="alert alert-warning d-none mt-4" role="alert"></div>
        <!-- Mensaje cuando los filtros no encuentran coincidencias. -->
        <div id="noResults" class="text-center mt-5" style="display: none;">
            <i class="bi bi-search fs-1 text-secondary mb-3"></i>
            <h4 class="text-dark">No se encontraron vuelos</h4>
            <p class="text-secondary">Prueba con otra búsqueda.</p>
        </div>

    <div class="modal fade" id="flightDetailsModal" tabindex="-1" aria-labelledby="flightDetailsTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="flightDetailsTitle">Detalles del vuelo</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <dl id="flightDetails" class="mb-0"></dl>
                </div>
            </div>
        </div>
    </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="historialVuelos.js"></script>
</body>
</html>
